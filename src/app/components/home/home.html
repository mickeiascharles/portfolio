<section class="home-container">
  <div class="editor-toolbar">
    <button
      type="button"
      class="run-btn"
      (click)="openTerminal()"
      [title]="language.text().home.runButtonTitle"
    >
      <i class="bi bi-play-fill"></i>
      <span>{{ language.text().home.runButton }}</span>
    </button>
  </div>

  <div class="code-background">
    <pre><code>{{ language.text().home.codeSample }}</code></pre>
  </div>

  <div class="character-wrapper">
    <img
      src="assets/character.webp"
      [alt]="language.text().home.characterAlt"
      class="character-img"
    />
  </div>

  <div class="terminal-overlay" *ngIf="isTerminalOpen" (click)="closeTerminal()">
    <div
      class="terminal-window"
      role="dialog"
      aria-modal="true"
      aria-labelledby="terminal-title"
      (click)="$event.stopPropagation()"
    >
      <div class="terminal-header">
        <div id="terminal-title" class="terminal-title">
          <i class="bi bi-terminal-fill"></i>
          <span>{{ language.text().home.terminalTitle }}</span>
        </div>
        <button
          type="button"
          class="close-btn"
          [attr.aria-label]="language.text().home.closeTerminalLabel"
          (click)="closeTerminal()"
        >
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <div class="terminal-body">
        <p *ngFor="let line of displayedLines" [class]="line.cssClass">
          {{ line.text }}
        </p>
      </div>
    </div>
  </div>
</section>
