<section class="projects-container">
  <div class="projetos-side-image">
    <img src="assets/projetos-bd.png" [alt]="language.text().projects.sideImageAlt" loading="eager" />
  </div>

  <article *ngFor="let project of language.text().projects.items" class="project-item">
    <h2>
      <span
        *ngIf="project.logo; else tituloEmTexto"
        class="project-logos"
        [class.with-icon]="project.subLogo?.asIcon"
      >
        <img
          class="project-logo"
          [class.darken]="project.darkenLogo"
          [src]="project.logo"
          [alt]="project.title"
          loading="lazy"
          decoding="async"
        />
        <span *ngIf="project.logoCaption" class="project-logo-caption">{{
          project.logoCaption
        }}</span>
        <img
          *ngIf="project.subLogo"
          class="project-sublogo"
          [class.as-icon]="project.subLogo.asIcon"
          [src]="project.subLogo.src"
          [alt]="project.subLogo.alt"
          loading="lazy"
          decoding="async"
        />
      </span>
      <ng-template #tituloEmTexto>{{ project.title }}</ng-template>
    </h2>
    <p>{{ project.description }}</p>
    <div *ngIf="project.links" class="project-links">
      <ng-container
        *ngTemplateOutlet="linksTemplate; context: { $implicit: project.links }"
      ></ng-container>
    </div>
    <div *ngFor="let group of project.linkGroups" class="project-link-group">
      <h3 class="project-link-group-title">{{ group.title }}</h3>
      <div class="project-links">
        <ng-container
          *ngTemplateOutlet="linksTemplate; context: { $implicit: group.links }"
        ></ng-container>
      </div>
    </div>
  </article>

  <ng-template #linksTemplate let-links>
    <a
      *ngFor="let link of links"
      [href]="link.href"
      target="_blank"
      class="link-btn"
      rel="noopener noreferrer"
    >
      <i [class]="link.iconClass"></i>
      <span>{{ link.label }}</span>
    </a>
  </ng-template>
</section>
