<section class="sobre-container">
  <div class="content-wrapper">
    <div class="profile-header">
      <img
        src="assets/sobre_mim/profile.webp"
        [alt]="language.text().about.profileAlt"
        class="profile-img"
      />
    </div>

    <div class="text-content">
      <p *ngFor="let paragraph of language.text().about.paragraphs">
        {{ paragraph }}
      </p>
    </div>

    <div class="skills-section">
      <h3>{{ language.text().about.languagesTitle }}</h3>
      <br />
      <div class="skill-group">
        <div class="icons">
          <span *ngFor="let tecnologia of linguagens" class="skill" [attr.data-nome]="tecnologia.nome">
            <img
              [src]="'assets/icons/' + tecnologia.icone + '.svg'"
              [alt]="tecnologia.nome"
              class="skill-icon"
              loading="lazy"
            />
          </span>
        </div>
      </div>

      <h3>{{ language.text().about.toolsTitle }}</h3>
      <br />
      <div class="skill-group">
        <div class="icons">
          <span *ngFor="let tecnologia of ferramentas" class="skill" [attr.data-nome]="tecnologia.nome">
            <img
              [src]="'assets/icons/' + tecnologia.icone + '.svg'"
              [alt]="tecnologia.nome"
              class="skill-icon"
              loading="lazy"
            />
          </span>
        </div>
      </div>

      <h3>{{ language.text().about.badgesTitle }}</h3>
      <br />
      <div class="skill-group">
        <div class="badges">
          <img
            *ngFor="let badge of language.text().about.badges"
            [src]="badge.src"
            [alt]="badge.alt"
            [title]="badge.alt"
            class="badge-icon"
          />
        </div>
      </div>
    </div>

    <footer class="contacts-footer">
      <div class="social-links">
        <a
          href="https://github.com/mickeiascharles"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
          title="GitHub"
          ><i class="bi bi-github"></i
        ></a>
        <a
          href="https://www.instagram.com/mickeiascharles/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
          title="Instagram"
          ><i class="bi bi-instagram"></i
        ></a>
        <a
          href="https://linkedin.com/in/mickeiascharles"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
          title="LinkedIn"
          ><i class="bi bi-linkedin"></i
        ></a>
        <a
          href="http://lattes.cnpq.br/6360150475711251"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Currículo Lattes"
          title="Currículo Lattes"
          ><i class="bi bi-journal-text"></i
        ></a>
        <a
          href="https://www.credly.com/users/mickeiascharles"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Credly"
          title="Credly"
          ><i class="bi bi-patch-check-fill"></i
        ></a>
        <a
          href="https://huggingface.co/mickeias"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Hugging Face"
          title="Hugging Face"
          ><svg class="icone-svg" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill-rule="evenodd"
              d="M12 2a9 9 0 1 1 0 18a9 9 0 1 1 0-18ZM8.8 7.9a1.4 1.4 0 1 0 0 2.8a1.4 1.4 0 1 0 0-2.8ZM15.2 7.9a1.4 1.4 0 1 0 0 2.8a1.4 1.4 0 1 0 0-2.8ZM7.6 12.4Q12 18 16.4 12.4Q12 14.6 7.6 12.4Z"
            />
            <rect class="mao" x="1.6" y="14.6" width="5.6" height="7" rx="2.8" transform="rotate(-35 4.4 18.1)" />
            <rect class="mao" x="16.8" y="14.6" width="5.6" height="7" rx="2.8" transform="rotate(35 19.6 18.1)" /></svg
        ></a>
      </div>

      <div class="contact-divider"></div>

      <div class="contact-info">
        <div class="contact-item">
          <i class="bi bi-whatsapp"></i>
          <span>+55 (21) 9 7099-2766</span>
        </div>
        <div class="contact-item">
          <i class="bi bi-envelope"></i>
          <span>contatomickeias@gmail.com</span>
        </div>
      </div>
    </footer>
  </div>
</section>
